# Hexagonal dependency rule: dependencies only point inwards. Run with vendor/bin/deptrac.
deptrac:
    paths:
        - ./src
    layers:
        -
            name: Domain
            collectors:
                -
                    type: classLike
                    value: ^App\\[^\\]+\\Domain\\.*
        -
            name: Application
            collectors:
                -
                    type: classLike
                    value: ^App\\[^\\]+\\Application\\.*
        -
            name: Infrastructure
            collectors:
                -
                    type: classLike
                    value: ^App\\[^\\]+\\Infrastructure\\.*
        -
            name: Framework
            collectors:
                -
                    type: classLike
                    value: ^(Symfony|Doctrine|MongoDB|Psr)\\.*
    ruleset:
        Domain: ~
        Application:
            - Domain
        Infrastructure:
            - Application
            - Domain
            - Framework
