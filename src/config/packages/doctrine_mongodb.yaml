doctrine_mongodb:
    auto_generate_proxy_classes: true
    auto_generate_hydrator_classes: true
    connections:
        default:
            server: '%env(MONGODB_URI)%'
            options: {}
    default_database: '%env(MONGODB_DB)%'
    # Ids are stored as BSON binary UUIDs, and read back as each context's id value object.
    types:
        job_position_id: App\JobPosition\Infrastructure\Persistence\JobPositionIdType
        candidate_application_job_position_id: App\CandidateApplication\Infrastructure\Persistence\JobPositionIdType
        candidate_application_id: App\CandidateApplication\Infrastructure\Persistence\CandidateApplicationIdType
    document_managers:
        default:
            auto_mapping: false
            # One mapping per bounded context. XML keeps the Domain free of
            # persistence attributes.
            mappings:
                JobPosition:
                    type: xml
                    dir: '%kernel.project_dir%/src/JobPosition/Infrastructure/Persistence/Mapping'
                    prefix: 'App\JobPosition\Domain'
                CandidateApplication:
                    type: xml
                    dir: '%kernel.project_dir%/src/CandidateApplication/Infrastructure/Persistence/Mapping'
                    prefix: 'App\CandidateApplication\Domain'

when@prod:
    doctrine_mongodb:
        auto_generate_proxy_classes: false
        auto_generate_hydrator_classes: false
        document_managers:
            default:
                metadata_cache_driver:
                    type: service
                    id: doctrine_mongodb.system_cache_pool

    framework:
        cache:
            pools:
                doctrine_mongodb.system_cache_pool:
                    adapter: cache.system
