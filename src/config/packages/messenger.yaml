framework:
    messenger:
        default_bus: command.bus

        buses:
            command.bus: ~
            query.bus: ~
            event.bus:
                # An event may have no subscribers yet.
                default_middleware:
                    enabled: true
                    allow_no_handlers: true

        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                # A failed enrichment is tried 3 more times (after 1 s, 2 s, 4 s), then
                # marked as failed and moved to the failure transport.
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            failed: '%env(MESSENGER_FAILURE_TRANSPORT_DSN)%'

        # Commands and queries are not routed, so they run synchronously.
        routing:
            App\Shared\Domain\Event\DomainEvent: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
