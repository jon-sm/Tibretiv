[www]
listen = /run/php/fpm.sock
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
ping.path = /healthz
; Read by php-fpm_exporter over the socket. nginx does not route this path.
pm.status_path = /status
; Keep the container environment so that Symfony can read it.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
