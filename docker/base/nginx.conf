worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 20m;

    client_body_temp_path /run/nginx/client_body;
    proxy_temp_path /run/nginx/proxy;
    fastcgi_temp_path /run/nginx/fastcgi;
    uwsgi_temp_path /run/nginx/uwsgi;
    scgi_temp_path /run/nginx/scgi;

    server {
        listen 8080;
        root /code/public;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass unix:/run/php/fpm.sock;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            internal;
        }

        # Container healthcheck: proves nginx can reach PHP-FPM.
        location = /healthz {
            access_log off;
            allow 127.0.0.1;
            deny all;
            fastcgi_pass unix:/run/php/fpm.sock;
            include fastcgi_params;
            fastcgi_param SCRIPT_NAME /healthz;
            fastcgi_param SCRIPT_FILENAME /healthz;
        }

        location ~ \.php$ {
            return 404;
        }
    }
}
